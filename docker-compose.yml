# ─────────────────────────────────────────────────────────────────────
# AIRTEC — full stack for Dokploy (Compose deployment) or local Docker.
#
# Three services: the API, the staff admin app, and the parent/student
# family portal. Both apps proxy /api/* to the backend over the internal
# Docker network, so the backend needs no public domain and there is no
# CORS to configure for either.
#
# In Dokploy: create a "Compose" application pointing at this repo, set the
# environment variables below in the Environment tab, then assign a domain
# to EACH of the two web apps, targeting their container ports:
#   staff admin   → frontend, container port 3000
#   family portal → portal,   container port 3001
#
# Host ports are loopback-bound (127.0.0.1) and taken from env. Defaults
# are 3010/3011/4010 (NOT 3000/3001/4000) so they don't collide with
# another app on a shared Dokploy host — if that host already runs
# something on the port you pick, the container fails to start with
# "port is already allocated".
#   WEB_HOST_PORT     (staff app, default 3010)
#   PORTAL_HOST_PORT  (portal,    default 3011)
#   BACKEND_HOST_PORT (backend,   default 4010)
# Set them in the Dokploy Environment tab to any free ports.
#
# The public DOMAIN is independent of these: Dokploy/Traefik routes the
# domain to the CONTAINER port, so the domain works regardless of the
# host port.
#
# One cross-app link needs real public URLs (the browser follows them, so
# internal service names won't do): NEXT_PUBLIC_STAFF_APP_URL on the
# portal, and NEXT_PUBLIC_FAMILY_APP_URL on the staff app — the latter is
# where a parent/student who lands on the staff login gets redirected.
#
# Local run:  docker compose up --build
#   staff  → http://localhost:${WEB_HOST_PORT:-3010}
#   portal → http://localhost:${PORTAL_HOST_PORT:-3011}
# ─────────────────────────────────────────────────────────────────────
services:
  backend:
    build:
      context: ./backend
    image: airtec-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      # Web push signing pair (npx web-push generate-vapid-keys). Push is
      # simply skipped when these are absent, so leaving them unset is a
      # supported configuration rather than a startup failure.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # OneSignal reaches the Median-wrapped app, which has no Web Push
      # API and so can never be served by the VAPID pair above. Both come
      # from the OneSignal dashboard and must match the credentials in
      # Median App Studio's OneSignal plugin.
      #
      # These have to be listed here, not just set in Dokploy: compose
      # only passes through what this block names, so a key present in the
      # Environment tab and absent from this list reaches the container as
      # undefined. That is not a loud failure — a user with a second
      # web-push device still gets a delivery marked `sent`, so the app
      # reports push working while every phone in the Median wrapper is
      # silently skipped.
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
      ONESIGNAL_REST_API_KEY: ${ONESIGNAL_REST_API_KEY:-}
      # Where a push tap lands. Notification links are app-relative, and a
      # relative target is not something a native notification can act on,
      # so without this every OneSignal tap opens the app's default page.
      APP_BASE_URL: ${APP_BASE_URL:-}
      # Every date this product computes is a school's date: which day a
      # receipt belongs to, which month a collection lands in, and above
      # all which financial year a payment on 31 March falls into. A
      # container defaults to UTC, and UTC is 5.5 hours behind the school
      # — so an evening collection on 31 March files itself into April.
      # `shared/utils/timezone.ts` pins the same value at process start;
      # this makes it true for the whole container, not just Node.
      TZ: ${TZ:-Asia/Kolkata}
      # Said out loud on purpose. `activeProvider()` THROWS when this is
      # unset and NODE_ENV is production, because the old silent
      # `?? 'mock'` meant a live deploy ran the simulator — and what the
      # simulator does is mark orders paid. Change to 'razorpay' only
      # together with the two RAZORPAY_* keys below.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      # Signs and verifies the provider callback. The backend refuses to
      # serve the gateway routes without it rather than falling back to a
      # key that lives in the repository. Any long random string (>= 16
      # chars) while the provider is 'mock'; with Razorpay it must match
      # the secret set in their dashboard.
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      # CORS allow-list. Both apps proxy /api over the internal network,
      # so same-origin traffic needs none of these — they matter only if
      # a browser is ever pointed straight at the backend's domain.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      FAMILY_FRONTEND_URL: ${FAMILY_FRONTEND_URL:-}
      # HRMS attendance source. Defaults in code to the live analytics
      # host; override only to point at a staging instance.
      SCHOOLKNOT_BASE_URL: ${SCHOOLKNOT_BASE_URL:-}
    expose:
      - "4000"
    ports:
      # Loopback-bound: the frontend reaches the backend over the compose
      # network as http://backend:4000; this is just for local host access.
      - "127.0.0.1:${BACKEND_HOST_PORT:-4010}:4000"

  frontend:
    build:
      context: ./frontend
      args:
        # Both are baked in at BUILD time (Next inlines NEXT_PUBLIC_* and
        # evaluates rewrites() during the build):
        #  - NEXT_PUBLIC_API_URL: relative same-origin base the browser uses
        #  - BACKEND_URL: the /api rewrite target (internal service name)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        BACKEND_URL: ${BACKEND_URL:-http://backend:4000}
        # Public URL of the family portal — where a parent/student who
        # lands on the staff login gets redirected.
        NEXT_PUBLIC_FAMILY_APP_URL: ${NEXT_PUBLIC_FAMILY_APP_URL:-http://localhost:${PORTAL_HOST_PORT:-3011}}
    image: airtec-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3010}:3000"

  # Parent/student app — a separate Next.js app with its own login and its
  # own domain, not a route group inside the staff app. It proxies /api to
  # the same backend over the internal network exactly as the staff app
  # does, so it needs no public backend URL and no CORS entry.
  portal:
    build:
      context: ./frontend-portal
      args:
        NEXT_PUBLIC_API_URL: ${PORTAL_NEXT_PUBLIC_API_URL:-/api}
        BACKEND_URL: ${BACKEND_URL:-http://backend:4000}
        # Absolute, cross-app link on the portal's login screen ("staff
        # sign in here") — must be the staff app's PUBLIC domain, since
        # the browser follows it, not the container network.
        NEXT_PUBLIC_STAFF_APP_URL: ${NEXT_PUBLIC_STAFF_APP_URL:-http://localhost:${WEB_HOST_PORT:-3010}}
    image: airtec-portal
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3001
    expose:
      - "3001"
    ports:
      - "127.0.0.1:${PORTAL_HOST_PORT:-3011}:3001"
