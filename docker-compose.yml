# ─────────────────────────────────────────────────────────────────────
# AIRTEC — full stack for Dokploy (Compose deployment) or local Docker.
#
# In Dokploy: create a "Compose" application pointing at this repo, set the
# environment variables below in the Environment tab, then assign a domain
# to ONLY the frontend (container port 3000). The frontend proxies /api/*
# to the backend over the internal Docker network, so the backend needs no
# public domain and there is no CORS to configure.
#
# No host `ports:` are published — Dokploy/Traefik routes to the container
# via the exposed port + the domain you assign (set the domain's target
# Port to 3000, the container port). Publishing a host port collides with
# other apps on the shared host ("port is already allocated").
#
# For LOCAL browser access, add the (non-auto-merged) local override file:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
# ─────────────────────────────────────────────────────────────────────
services:
  backend:
    build:
      context: ./backend
    image: airtec-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET: ${JWT_SECRET}
    # Internal only — reached by the frontend as http://backend:4000.
    expose:
      - "4000"

  frontend:
    build:
      context: ./frontend
      args:
        # Both are baked in at BUILD time (Next inlines NEXT_PUBLIC_* and
        # evaluates rewrites() during the build):
        #  - NEXT_PUBLIC_API_URL: relative same-origin base the browser uses
        #  - BACKEND_URL: the /api rewrite target (internal service name)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        BACKEND_URL: http://backend:4000
    image: airtec-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
