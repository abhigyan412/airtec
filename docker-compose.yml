# ─────────────────────────────────────────────────────────────────────
# AIRTEC — full stack for Dokploy (Compose deployment) or local Docker.
#
# In Dokploy: create a "Compose" application pointing at this repo, set the
# environment variables below in the Environment tab, then assign a domain
# to ONLY the frontend (target the container port, 3000). The frontend
# proxies /api/* to the backend over the internal Docker network, so the
# backend needs no public domain and there is no CORS to configure.
#
# Host ports are loopback-bound (127.0.0.1) and taken from env. Defaults
# are 3010/4010 (NOT 3000/4000) so they don't collide with another app on
# a shared Dokploy host — if that host already runs something on the port
# you pick, the container fails to start with "port is already allocated".
#   WEB_HOST_PORT     (frontend, default 3010)
#   BACKEND_HOST_PORT (backend,  default 4010)
# Set them in the Dokploy Environment tab to any free ports.
#
# The public DOMAIN is independent of these: Dokploy/Traefik routes the
# domain to the CONTAINER port (frontend = 3000), so the domain works
# regardless of the host port. Assign one frontend domain → port 3000.
#
# Local run:  docker compose up --build   → http://localhost:${WEB_HOST_PORT:-3010}
# ─────────────────────────────────────────────────────────────────────
services:
  backend:
    build:
      context: ./backend
    image: airtec-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "4000"
    ports:
      # Loopback-bound: the frontend reaches the backend over the compose
      # network as http://backend:4000; this is just for local host access.
      - "127.0.0.1:${BACKEND_HOST_PORT:-4010}:4000"

  frontend:
    build:
      context: ./frontend
      args:
        # Both are baked in at BUILD time (Next inlines NEXT_PUBLIC_* and
        # evaluates rewrites() during the build):
        #  - NEXT_PUBLIC_API_URL: relative same-origin base the browser uses
        #  - BACKEND_URL: the /api rewrite target (internal service name)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        BACKEND_URL: ${BACKEND_URL:-http://backend:4000}
    image: airtec-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3010}:3000"
