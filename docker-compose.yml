# ─────────────────────────────────────────────────────────────────────
# AIRTEC — full stack for Dokploy (Compose deployment) or local Docker.
#
# In Dokploy: create a "Compose" application pointing at this repo, set the
# environment variables below in the Environment tab, then assign a domain
# to ONLY the frontend (target the container port, 3000). The frontend
# proxies /api/* to the backend over the internal Docker network, so the
# backend needs no public domain and there is no CORS to configure.
#
# Host ports are loopback-bound (127.0.0.1) and taken from env so they can
# be moved to avoid a clash on a shared host:
#   WEB_HOST_PORT     (frontend, default 3000)
#   BACKEND_HOST_PORT (backend,  default 4000)
# e.g. `WEB_HOST_PORT=3010 docker compose up`, or set them in Dokploy env.
# Domain routing goes through Traefik to the container port regardless of
# the host port, so a domain keeps working even if you change these.
#
# Local run:  docker compose up --build   → http://localhost:${WEB_HOST_PORT:-3000}
# ─────────────────────────────────────────────────────────────────────
services:
  backend:
    build:
      context: ./backend
    image: airtec-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "4000"
    ports:
      # Loopback-bound: the frontend reaches the backend over the compose
      # network as http://backend:4000; this is just for local host access.
      - "127.0.0.1:${BACKEND_HOST_PORT:-4000}:4000"

  frontend:
    build:
      context: ./frontend
      args:
        # Both are baked in at BUILD time (Next inlines NEXT_PUBLIC_* and
        # evaluates rewrites() during the build):
        #  - NEXT_PUBLIC_API_URL: relative same-origin base the browser uses
        #  - BACKEND_URL: the /api rewrite target (internal service name)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        BACKEND_URL: ${BACKEND_URL:-http://backend:4000}
    image: airtec-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
