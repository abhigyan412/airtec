services:
  - type: web
    name: airtec-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: airtec-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      # Same-origin: the browser calls /api on this service and the
      # rewrite in next.config.js proxies it onward, so there is no
      # cross-origin request and nothing to allowlist. Setting an
      # absolute backend URL here instead would bypass the proxy and
      # put every browser call back into CORS territory.
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: BACKEND_URL
        value: https://airtec-backend.onrender.com
