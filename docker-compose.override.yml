# Local-only overrides — publishes a host port so you can reach the app at
# http://localhost:${FRONTEND_PORT:-3000} during `docker compose up`. The
# host port is taken from FRONTEND_PORT (default 3000) so you can avoid a
# local conflict without editing this file, e.g. `FRONTEND_PORT=3010 docker
# compose up`. Docker Compose merges this automatically; Dokploy does NOT
# use override files, so production stays port-conflict-free (routing via
# Traefik + assigned domain).
services:
  frontend:
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
